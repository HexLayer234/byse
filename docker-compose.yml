version: '3.8'

services:
  byse:
    build: .
    container_name: byse-bot
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NEWS_API_KEY=${NEWS_API_KEY}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./trades.db:/app/trades.db
      - ./bot_state.json:/app/bot_state.json
      - ./config.py:/app/config.py
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
